<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AlgoNovaX Login</title>
  <style>
    body { font-family: system-ui; margin: 24px; max-width: 520px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; }
    input, button { padding: 10px 12px; border-radius: 10px; width: 100%; }
    button { margin-top: 10px; cursor: pointer; }
    small { color: #555; }
    code { background: #f3f3f3; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <h2>AlgoNovaX</h2>
  <div class="card">
    <form method="post" action="/api/auth/login">
      <label>PIN</label>
      <input name="pin" inputmode="numeric" pattern="[0-9]*" placeholder="4-12 digits" required>
      <button type="submit">Login</button>
    </form>
    <hr style="margin:16px 0;">
    <small>First time? Run: <code>curl -X POST http://127.0.0.1:8010/api/auth/setup -d "pin=1234"</code></small>
  </div>
</body>
</html>
