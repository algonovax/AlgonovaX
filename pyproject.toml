[build-system]
requires = ["setuptools>=80.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algonovax"
version = "0.1.0"
description = "AlgoNovaX trading engine + API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "python-dotenv>=1.1.0",
]
readme = "README.md"

[project.scripts]
algonovax = "algonovax.__main__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["algonovax*"]
