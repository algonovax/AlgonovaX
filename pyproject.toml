[build-system]
requires = ["setuptools>=80.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algonovax"
version = "0.1.0"
description = "AlgoNovaX trading engine + API"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"

[project.scripts]
algonovax = "algonovax.__main__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["algonovax*"]


    [project.optional-dependencies]
api = ["fastapi>=0.128.0", "uvicorn>=0.40.0", "jinja2>=3.1.0", "python-multipart>=0.0.21"]
[tool.ruff]
exclude = [
  ".git",
  ".venv",
  ".mypy_cache",
  ".pytest_cache",
  ".patch_bak",
  "audit",
  "data",
  "logs",
  "legacy",
  "scripts",
  "var",
  "archive",
]

[tool.ruff.lint]
# keep defaults; we just want signal first
ignore = []

