name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e .
          python -m pip install -U ruff pytest

      - name: Lint (ruff)
        run: |
          ruff --version
          ruff check algonovax

      - name: Tests
        run: |
          pytest -q
      - name: Import check
        run: |
          python -c "import algonovax; print('algonovax import ok')"
